    <script type="text/babel">
        const { useState, useEffect } = React;

        function PostGenerator() {
            const allPosts = [
                // Data Engineering
                { linkedin: "Built reproducible ETL pipelines handling 1M+ transactions across SQL + AWS S3.\n\nStack: Python/Pandas + SQL schema validation + AWS S3 storage.\n\nData moved from chaotic CSVs to structured, versioned, scalable infrastructure.\n\nIf you're manually moving data around, it's time to build pipelines.\n\n#DataEngineering #ETL #AWS", handshake: "Building ETL Pipelines for 1M+ Transactions 🔄\n\nDesigned reproducible data pipelines handling massive transaction volumes.\n\nArchitecture:\n• Data ingestion: Python/Pandas transformations\n• Validation: SQL schema checks\n• Storage: AWS S3 (scalable, secure)\n\nBefore: Manual CSV shuffling\nAfter: Production infrastructure\n\nSeeking: Data Engineering internships", category: "Data Engineering", imageKeyword: "data pipeline" },
                { linkedin: "Data quality improvements compound. Implemented validation frameworks that reduced errors by 20%.\n\nSchema validation + deduplication + null handling = clean pipelines. This unglamorous work separates professional systems from hobby projects.\n\nGarbage in → garbage out. Invest in data quality first.\n\n#DataEngineering #DataQuality", handshake: "Data Quality Framework 📊\n\nImproved data accuracy by 20% through:\n• Schema validation (type checking)\n• Deduplication (removing duplicates)\n• Null handling (strategic imputation)\n• Outlier detection (IQR-based)\n\nClean data = reliable models.\n\nSeeking: Data Engineering internships\nSkills: Data validation, SQL, Python", category: "Data Engineering", imageKeyword: "data quality" },
                { linkedin: "Starting with AWS S3 for data storage instead of local CSVs changed everything.\n\nBenefits:\n• Scalable (10MB → 10TB seamlessly)\n• Reproducible (versioned, auditable)\n• Shareable (team access)\n• Secure (encryption, access controls)\n\nModern data science requires cloud thinking. S3 is day one.\n\n#AWS #CloudComputing #DataEngineering", handshake: "Scaling Data Science: Local → Cloud ☁️\n\nMoved from local CSV files to AWS S3.\n\nWhy S3 matters:\n✓ Scalability: 10MB → 10TB seamlessly\n✓ Reproducibility: Versioned data\n✓ Collaboration: Team access\n✓ Security: Encryption + access controls\n\nStandard for any data science role.\n\nSeeking: Cloud Data / ML Engineering internships", category: "Data Engineering", imageKeyword: "cloud computing" },
                { linkedin: "Database optimization matters more than people think. Optimized queries handling 1M+ records reduced execution time by 60%.\n\nIndexing + query planning + normalization = performance. Your database is as important as your algorithm.\n\nLearn SQL deeply. Seriously.\n\n#SQL #DataEngineering #Database", handshake: "Database Optimization at Scale 🗄️\n\nOptimized queries on 1M+ records.\n\nTechniques:\n• Proper indexing (B-tree optimization)\n• Query planning (explain analyze)\n• Denormalization (strategic tradeoffs)\n• Connection pooling (resource management)\n\nResult: 60% faster execution.\n\nSeeking: Data Engineering internships\nSkills: SQL, database design", category: "Data Engineering", imageKeyword: "database" },
                { linkedin: "Data pipeline monitoring is your safety net. Built dashboards tracking ingestion rates, error rates, and data quality metrics.\n\nYou can't manage what you don't measure. Visibility = confidence. Confidence = production-ready systems.\n\n#DataEngineering #Monitoring #MLOps", handshake: "Data Pipeline Monitoring 📈\n\nBuilt real-time dashboards tracking:\n• Ingestion rates\n• Error rates\n• Data quality metrics\n• Performance benchmarks\n\nResult: Catch issues before they become problems.\n\nSeeking: Data Engineering / MLOps internships\nSkills: Monitoring, alerting, dashboards", category: "Data Engineering", imageKeyword: "monitoring dashboard" },
                { linkedin: "Learned Apache Spark for distributed computing. Processing 100GB datasets that would timeout locally now completes in minutes.\n\nMap-reduce paradigm → parallel processing at scale.\n\nBig data demands big tools. Spark is the standard.\n\n#BigData #ApacheSpark #DataEngineering", handshake: "Apache Spark: Big Data Processing ⚡\n\nBuilt Spark jobs for distributed computing:\n• DataFrame API (SQL-like operations)\n• RDD transformations (low-level)\n• Partitioning (parallel processing)\n\nResult: 100GB datasets in minutes.\n\nSeeking: Data Engineering internships\nSkills: Spark, Hadoop, distributed systems", category: "Data Engineering", imageKeyword: "big data" },
                { linkedin: "Data versioning with DVC (Data Version Control). Track dataset changes like you track code.\n\nWhen did this dataset change? Which version caused the model degradation?\n\nReproducibility requires versioned data.\n\n#DataEngineering #DVC #Reproducibility", handshake: "Data Versioning with DVC 📋\n\nManaging dataset lifecycle:\n• Version control for data (like Git)\n• Track data lineage\n• Reproduce experiments\n• Collaborate on datasets\n\nCritical for reproducible ML.\n\nSeeking: Data Engineering internships\nSkills: DVC, versioning, reproducibility", category: "Data Engineering", imageKeyword: "version control" },

                // Machine Learning
                { linkedin: "Feature engineering is where 80% of ML work lives. Engineered features from 1M+ transactions:\n• Merchant risk scores (categorical embeddings)\n• Transaction velocity (sliding windows)\n• Amount deviations (z-score anomalies)\n\nRaw data → meaningful features → better models.\n\n#FeatureEngineering #MachineLearning #DataScience", handshake: "Feature Engineering at Scale 📊\n\nEngineered features from 1M+ transactions:\n✓ Merchant risk scores (embeddings)\n✓ Transaction velocity (sliding windows)\n✓ Amount anomalies (z-score)\n\nReality: 80% time on features, 20% on models.\n\nSeeking: ML / Data Science internships\nSkills: Feature engineering, SQL, Python", category: "Machine Learning", imageKeyword: "feature engineering" },
                { linkedin: "Training your model? Don't stop at accuracy.\n\nPrecision, Recall, F1-Score, ROC-AUC. When you have imbalanced data (95% negative, 5% positive), accuracy is meaningless.\n\nWe needed high precision (fewer false alerts) + high recall (catch fraud). Accuracy alone failed.\n\nChoose metrics aligned with business reality.\n\n#MachineLearning #ModelEvaluation", handshake: "Model Evaluation Beyond Accuracy 📈\n\nAccuracy is a trap with imbalanced data.\n\nWith 95% legitimate, 5% fraud:\n• Accuracy alone = misleading\n• Need: Precision + Recall\n• Threshold tuning: ROC-AUC\n\nChoose metrics aligned with business goals.\n\nSeeking: Data Science roles\nSkills: Model evaluation, statistical testing", category: "Machine Learning", imageKeyword: "machine learning metrics" },
                { linkedin: "Hyperparameter tuning transforms models from decent to production-ready.\n\nUsed GridSearchCV to benchmark 6 classifiers. Tested learning rates, tree depth, regularization.\n\nSystematic search > manual tweaking. Use Optuna or GridSearchCV. Always.\n\n#MachineLearning #HyperparameterTuning #DataScience", handshake: "Hyperparameter Optimization 🎯\n\nTuned 6 classifiers on EEG data (178 features).\n\nProcess:\n• Define parameter grid\n• GridSearchCV tests combinations\n• Cross-validation prevents overfitting\n• Result: 78% accuracy\n\nSystematic tuning > random guessing.\n\nSeeking: ML Engineering internships\nSkills: GridSearchCV, Scikit-learn", category: "Machine Learning", imageKeyword: "hyperparameter tuning" },
                { linkedin: "Class imbalance is the elephant in every ML room.\n\n95% negative, 5% positive → model learns to predict \"negative\" always and gets 95% accuracy (useless).\n\nSolution: SMOTE + threshold tuning. Suddenly your model detects the 5%.\n\nThis applies to fraud, healthcare, rare events.\n\n#MachineLearning #ClassImbalance #SMOTE", handshake: "Handling Class Imbalance: SMOTE 🔄\n\n95% legitimate, 5% fraud = standard model fails.\n\nSolution:\n• SMOTE: Oversample minority (5% → balanced)\n• Cross-validation: Prevent leakage\n• Threshold tuning: Adjust boundary\n• Metrics: Precision + Recall\n\nResult: 20% false positive reduction.\n\nSeeking: ML / Data Science internships\nSkills: SMOTE, Scikit-learn", category: "Machine Learning", imageKeyword: "class imbalance" },
                { linkedin: "Black boxes lose trust. SHAP changes that.\n\nBuilt models and applied SHAP to answer: \"Why did this predict X?\"\n\nSHAP shows which features matter + how much each contributes. Interpretability > accuracy alone.\n\nIn regulated industries, SHAP isn't optional.\n\n#SHAP #ModelInterpretability #Explainability", handshake: "SHAP: Making Models Interpretable 🔍\n\nBlack boxes don't survive in healthcare/finance.\n\nApplied SHAP across:\n• Logistic Regression (feature weights)\n• Random Forest (importance)\n• XGBoost (interactions)\n• LSTM (temporal patterns)\n\nResult: Trustworthy, explainable predictions.\n\nSeeking: ML Engineering roles\nSkills: SHAP, LIME, model interpretation", category: "Machine Learning", imageKeyword: "model explainability" },
                { linkedin: "Cross-validation prevents overfitting (your model memorizing training data).\n\nImplemented k-fold cross-validation on fraud detection. Model performed consistently across all folds.\n\nDon't just train-test split. Use cross-validation. Your future self will thank you.\n\n#MachineLearning #CrossValidation #DataScience", handshake: "Cross-Validation Best Practices ✓\n\nUsed k-fold cross-validation to prevent overfitting.\n\nApproach:\n• Divide data into k folds\n• Train on k-1 folds, test on 1\n• Repeat k times\n• Average results\n\nResult: Reliable performance estimate.\n\nSeeking: ML / Data Science internships\nSkills: Cross-validation, model evaluation", category: "Machine Learning", imageKeyword: "cross validation" },
                { linkedin: "Regularization controls model complexity. L1 (Lasso) + L2 (Ridge) prevent overfitting.\n\nTrained models with different regularization strengths. Found the sweet spot between bias and variance.\n\nUnderfitting → Overfitting. Regularization finds the balance.\n\n#MachineLearning #Regularization #DataScience", handshake: "Regularization: Controlling Complexity ⚖️\n\nTrained models with L1 (Lasso) and L2 (Ridge).\n\nTechniques:\n• L1: Feature selection (sparse weights)\n• L2: Weight shrinkage (small penalties)\n• Elastic Net: Both combined\n\nResult: Models that generalize better.\n\nSeeking: ML Engineering internships\nSkills: Regularization, Scikit-learn", category: "Machine Learning", imageKeyword: "regularization" },
                { linkedin: "Ensemble methods beat single models. Boosting, bagging, stacking.\n\nTrained Random Forest, Gradient Boosting, XGBoost on same dataset. XGBoost won by 5%.\n\nCombining weak learners → strong model.\n\n#MachineLearning #EnsembleMethods #XGBoost", handshake: "Ensemble Learning: Combining Models 🎯\n\nCompared ensemble techniques:\n• Bagging (parallel, reduces variance)\n• Boosting (sequential, reduces bias)\n• Stacking (meta-learner)\n\nResult: XGBoost outperformed individual models by 5%.\n\nSeeking: ML Engineering internships\nSkills: XGBoost, ensemble methods", category: "Machine Learning", imageKeyword: "ensemble learning" },

                // NLP & AI
                { linkedin: "Building an NLP pipeline: 600K+ financial news headlines → 7,000+ stocks → sentiment features → stock predictions.\n\nTech: FinBERT (Hugging Face) for sentiment + temporal features + XGBoost/LSTM.\n\nPlus SHAP explainability: \"Why is sentiment a strong predictor?\"\n\nNLP + finance = linguistics + quantitative analysis.\n\n#NLP #FinancialML #Transformers", handshake: "Financial Sentiment Analysis 📈\n\nBuilt NLP pipeline: 600K+ headlines → predictions\n\nArchitecture:\n→ 600K+ financial news headlines\n→ 7,000+ stock tickers\n→ FinBERT sentiment extraction\n→ XGBoost/LSTM predictions\n\nTechnology: Transformers, temporal features, SHAP\n\nSeeking: NLP / ML Engineering internships\nSkills: NLP, Transformers, FinBERT", category: "NLP & AI", imageKeyword: "natural language processing" },
                { linkedin: "Shipped an AI-powered SQL assistant: natural language → SQL queries in production.\n\nStack: OpenAI GPT + LLaMA + Streamlit + PostgreSQL. Non-technical users query databases without touching SQL.\n\nThe hard part? Prompt engineering, input validation, edge cases. LLMOps > raw LLM training.\n\nLive demo: wasiq-aisql.streamlit.app\n\n#LLM #GenerativeAI #MLOps", handshake: "AI SQL Assistant in Production 🚀\n\nBuilt generative AI app: natural language → SQL\n\nTech Stack:\n• LLMs: OpenAI GPT + LLaMA\n• Frontend: Streamlit\n• Backend: PostgreSQL\n• Deployment: Full-stack system\n\nLessons: Prompt engineering + validation = harder than LLM integration.\n\nLive: wasiq-aisql.streamlit.app\n\nSeeking: ML Engineering internships", category: "NLP & AI", imageKeyword: "artificial intelligence" },
                { linkedin: "Prompt engineering is a discipline now.\n\nOptimized prompts for SQL generation. Tested 10+ versions:\n• Few-shot examples (15% accuracy boost)\n• System roles (clarify context)\n• Error handling (graceful fallbacks)\n• Output formatting (structured JSON)\n\nBad prompt = garbage. Good prompt = reliable production.\n\n#LLMOps #PromptEngineering #GenerativeAI", handshake: "Prompt Engineering for Production 🎯\n\nOptimized prompts for SQL generation.\n\nTechniques:\n• Few-shot examples (teach by example)\n• System roles (context clarity)\n• Structured output (JSON format)\n• Error handling (fallbacks)\n• Versioning (track changes)\n\nResult: Reliable LLM systems.\n\nSeeking: LLMOps internships\nSkills: Prompt engineering, OpenAI API", category: "NLP & AI", imageKeyword: "prompt engineering" },
                { linkedin: "Sentiment analysis on YouTube comments: 50K+ comments → VADER + NRC Emotion Lexicon → insights.\n\nApplied VADER for polarity + NRC for emotions (joy, anger, fear, sadness).\n\nVisualizations with Matplotlib/Seaborn deliver audience insights.\n\nNLP → business intelligence.\n\n#NLP #SentimentAnalysis #TextAnalysis", handshake: "YouTube Sentiment Analysis 💬\n\nAnalyzed 50K+ comments for sentiment/emotions.\n\nProcess:\n• YouTube API data collection\n• VADER polarity detection\n• NRC emotion lexicon (joy, anger, fear, sadness)\n• Matplotlib/Seaborn visualization\n\nResult: Actionable audience insights.\n\nSeeking: NLP / Analytics internships\nSkills: VADER, NLTK, YouTube API", category: "NLP & AI", imageKeyword: "sentiment analysis" },
                { linkedin: "Text preprocessing matters. Tokenization + stopword removal + lemmatization = cleaner data.\n\nProcessed 100K+ documents. Consistent preprocessing → better NLP models.\n\nDon't skip this step. Foundation matters.\n\n#NLP #TextPreprocessing #DataScience", handshake: "Text Preprocessing Fundamentals 📝\n\nCleaned 100K+ documents:\n• Tokenization (split into words)\n• Stopword removal (remove common words)\n• Lemmatization (standardize forms)\n• Lowercasing (consistency)\n\nResult: High-quality NLP features.\n\nSeeking: NLP / Data Science internships\nSkills: NLTK, preprocessing, regex", category: "NLP & AI", imageKeyword: "text processing" },
                { linkedin: "Word embeddings transform text into vectors. Learned Word2Vec + GloVe + FastText.\n\nSame words have similar embeddings. \"King\" - \"Man\" + \"Woman\" ≈ \"Queen\".\n\nWord embeddings are the foundation of modern NLP.\n\n#NLP #WordEmbeddings #MachineLearning", handshake: "Word Embeddings: Text as Vectors 📊\n\nLearned representation learning:\n• Word2Vec (skip-gram, CBOW)\n• GloVe (global vectors)\n• FastText (subword information)\n\nKey insight: Similar words = similar vectors.\n\nApplications: Document similarity, clustering, classification.\n\nSeeking: NLP internships\nSkills: Word2Vec, embeddings, gensim", category: "NLP & AI", imageKeyword: "word embeddings" },
                { linkedin: "Transformer models revolutionized NLP. Self-attention mechanisms let models focus on relevant context.\n\nLearned BERT, GPT architecture. Attention is all you need.\n\nTransformers > RNNs for most tasks.\n\n#Transformers #NLP #DeepLearning", handshake: "Transformers: The Modern Standard 🚀\n\nStudied Transformer architecture:\n• Self-attention (focus on relevant context)\n• Positional encoding (word order)\n• Multi-head attention (diverse perspectives)\n\nApplications: BERT, GPT, T5, specialized models.\n\nResult: State-of-the-art NLP performance.\n\nSeeking: NLP / ML Engineering internships\nSkills: Transformers, Hugging Face", category: "NLP & AI", imageKeyword: "transformers" },

                // Analytics
                { linkedin: "Data visualization tells stories. Built Tableau dashboards tracking student retention, engagement, KPIs.\n\nRaw metrics → visual stories → actionable insights.\n\nA good dashboard makes the answer obvious. Design for clarity.\n\n#DataVisualization #Tableau #Analytics", handshake: "Data Visualization & Dashboards 📊\n\nBuilt Tableau dashboards:\n• Student retention trends\n• Engagement metrics\n• Service performance KPIs\n• Cohort analysis\n\nPrinciple: Make the answer obvious.\n\nSeeking: Analytics / BI internships\nSkills: Tableau, Power BI, dashboard design", category: "Analytics", imageKeyword: "data visualization" },
                { linkedin: "A/B testing separates data-driven decisions from guesses.\n\nDesigned lift analysis testing marketing channels. P-value, confidence intervals, effect size.\n\nMost companies run A/B tests without understanding statistics. Learn hypothesis testing.\n\n#Statistics #ABTesting #Analytics", handshake: "A/B Testing & Statistical Rigor 🧪\n\nDesigned A/B testing framework:\n• Null hypothesis (no difference)\n• Sample size calculation\n• Test selection (t-test, chi-square)\n• P-value interpretation\n• Confidence intervals\n\nResult: Data-driven decisions.\n\nSeeking: Analytics internships\nSkills: Statistical testing, Python", category: "Analytics", imageKeyword: "A/B testing" },
                { linkedin: "Data science is 50% communication.\n\nBuilt a 92% accuracy model. Presented to leadership. They didn't care.\n\nReframed: \"Prevents $2M annual fraud losses, 20% fewer false alerts.\"\n\nSuddenly: green light.\n\nTechnical excellence without communication = wasted effort.\n\n#DataScience #Communication #Analytics", handshake: "Data Science is 50% Communication 💬\n\n92% accuracy ❌ (leadership unmoved)\n\"$2M prevention + fewer alerts\" ✅ (approved)\n\nGap: Technical excellence ≠ business impact.\n\nLessons: Learn data storytelling + business translation.\n\nSeeking: Data Science roles\nSkills: Communication, business acumen", category: "Analytics", imageKeyword: "data storytelling" },
                { linkedin: "Cohort analysis reveals user patterns. Segmented users by signup date, tracked retention/engagement across cohorts.\n\nWhich cohorts perform best? Why? When did behavior change?\n\nCohort analysis → retention insights.\n\n#Analytics #CohortAnalysis #DataScience", handshake: "Cohort Analysis for User Insights 👥\n\nSegmented users by signup date.\n\nMetrics tracked:\n• Retention rates (returning users)\n• Engagement levels (activity)\n• Lifetime value (revenue)\n• Churn patterns (why users leave)\n\nResult: Understand user behavior by group.\n\nSeeking: Analytics internships\nSkills: Cohort analysis, SQL, Python", category: "Analytics", imageKeyword: "cohort analysis" },
                { linkedin: "Funnel analysis shows where users drop off. Tracked: signup → onboarding → activation → retention.\n\nIdentified bottleneck at step 2. Fixed it. Improved conversion by 25%.\n\nEach step in the funnel tells a story.\n\n#Analytics #FunnelAnalysis #DataScience", handshake: "Funnel Analysis: Finding Bottlenecks 📉\n\nTracked user journey: signup → onboarding → activation\n\nResults:\n• Signup: 100%\n• Onboarding: 60% (bottleneck!)\n• Activation: 45%\n• Retention: 30%\n\nFixed onboarding → 25% conversion improvement.\n\nSeeking: Analytics / Product internships\nSkills: Funnel analysis, SQL", category: "Analytics", imageKeyword: "funnel analysis" },
                { linkedin: "RFM analysis (Recency, Frequency, Monetary) segments customers.\n\nHigh-value customers: recent activity, frequent purchases, high spend.\n\nLow-value: inactive, rare purchases, low spend.\n\nTarget retention efforts on high-value segments.\n\n#Analytics #CustomerSegmentation #DataScience", handshake: "RFM Analysis for Customer Value 💰\n\nSegmented customers using:\n• Recency (days since last purchase)\n• Frequency (number of purchases)\n• Monetary value (total spent)\n\nResult: Identify high-value customers → retention strategies.\n\nSeeking: Analytics / Marketing internships\nSkills: RFM analysis, SQL, segmentation", category: "Analytics", imageKeyword: "customer segmentation" },
                { linkedin: "Survival analysis predicts customer churn. Kaplan-Meier curves show time-to-churn distributions.\n\nIdentified high-risk cohorts. Intervened. Extended average customer lifetime by 30%.\n\n#Analytics #SurvivalAnalysis #Churn", handshake: "Survival Analysis & Churn Prediction 📊\n\nPredicted customer churn using:\n• Kaplan-Meier curves (time-to-event)\n• Cox regression (risk factors)\n• Proportional hazards model\n\nResult: 30% increase in customer lifetime.\n\nSeeking: Analytics / Data Science internships\nSkills: Survival analysis, statsmodels", category: "Analytics", imageKeyword: "churn prediction" },

                // Deep Learning
                { linkedin: "Deep learning isn't magic, it's matrix multiplication at scale.\n\nTrained LSTM models on EEG data. RNN architectures for sequence prediction. 90%+ accuracy on clinical test sets.\n\nThe hard part? Knowing when to use LSTM vs CNN vs Transformer.\n\n#DeepLearning #TensorFlow #PyTorch", handshake: "Deep Learning in Healthcare 🧠\n\nBuilt neural networks on EEG data:\n• LSTM for sequences\n• Dense layers for predictions\n• 90%+ accuracy on test sets\n\nKey insight: Architecture matters. LSTM vs CNN vs Transformer depends on problem.\n\nSeeking: Deep Learning internships\nSkills: TensorFlow, PyTorch, LSTM", category: "Deep Learning", imageKeyword: "deep learning" },
                { linkedin: "Time series forecasting: stock prices, traffic, patient readmission.\n\nBuilt LSTM + rolling averages + momentum signals. Bitcoin price forecasting across multiple horizons.\n\nStationarity matters. Seasonal decomposition matters.\n\n#TimeSeries #LSTM #Forecasting", handshake: "Time Series Forecasting 📈\n\nBitcoin price prediction using:\n• LSTM networks (sequences)\n• Rolling averages (trends)\n• Momentum signals (technical analysis)\n• Multiple time horizons\n\nKey: Stationarity + seasonal decomposition.\n\nSeeking: Time Series / ML internships\nSkills: LSTM, ARIMA, statsmodels", category: "Deep Learning", imageKeyword: "time series" },
                { linkedin: "Convolutional Neural Networks (CNNs) detect spatial patterns.\n\nBuilt image classification model. Conv layers extract features. Dense layers classify.\n\nCNNs are foundational for computer vision.\n\n#ComputerVision #CNN #DeepLearning", handshake: "Convolutional Neural Networks 👁️\n\nBuilt CNN for image classification:\n• Conv layers (spatial features)\n• Pooling layers (dimensionality)\n• Dense layers (classification)\n\nApplications: Image recognition, object detection, medical imaging.\n\nSeeking: Computer Vision internships\nSkills: CNN, TensorFlow, Keras", category: "Deep Learning", imageKeyword: "computer vision" },
                { linkedin: "Recurrent Neural Networks (RNNs) process sequences. LSTMs address vanishing gradient problem.\n\nGated recurrent units (GRUs) are lighter alternatives.\n\nSequence modeling: text, time series, video.\n\n#RNN #LSTM #DeepLearning", handshake: "RNNs for Sequential Data 📊\n\nMastered RNN architectures:\n• Vanilla RNN (basic recurrence)\n• LSTM (long-term dependencies)\n• GRU (lightweight alternative)\n\nApplications: Language modeling, machine translation, time series.\n\nSeeking: Deep Learning internships\nSkills: RNN, LSTM, sequence modeling", category: "Deep Learning", imageKeyword: "recurrent neural networks" },
                { linkedin: "Autoencoders learn compressed representations. Encoder compresses. Decoder reconstructs.\n\nApplications: Dimensionality reduction, anomaly detection, denoising.\n\nUnsupervised learning → meaningful features.\n\n#Autoencoders #DeepLearning #UnsupervisedLearning", handshake: "Autoencoders for Dimensionality Reduction 🔍\n\nBuilt encoder-decoder architecture:\n• Encoder: High-dimensional → compressed\n• Decoder: Compressed → reconstructed\n\nApplications: Dimensionality reduction, anomaly detection, image denoising.\n\nSeeking: Deep Learning internships\nSkills: Autoencoders, TensorFlow", category: "Deep Learning", imageKeyword: "autoencoder" },
                { linkedin: "Generative Adversarial Networks (GANs): Generator vs Discriminator.\n\nGenerator creates fake data. Discriminator distinguishes real vs fake.\n\nThey improve iteratively. Result: High-quality synthetic data.\n\n#GAN #DeepLearning #GenerativeAI", handshake: "GANs: Generative Models 🎨\n\nUnderstanding Generator vs Discriminator:\n• Generator: Creates synthetic data\n• Discriminator: Detects fake vs real\n• Adversarial training: Both improve\n\nApplications: Image generation, style transfer, data augmentation.\n\nSeeking: Deep Learning / AI internships\nSkills: GANs, adversarial training", category: "Deep Learning", imageKeyword: "generative AI" },
                { linkedin: "Attention mechanisms revolutionized deep learning. Instead of processing all context equally, models focus on what matters.\n\nAttention is the backbone of Transformers.\n\nThe future of deep learning = attention-based.\n\n#Attention #Transformers #DeepLearning", handshake: "Attention Mechanisms Explained 🎯\n\nUnderstanding attention:\n• Query: What am I looking for?\n• Key: What's in the data?\n• Value: What data do I return?\n\nResult: Focus on relevant context.\n\nApplications: Transformers, NLP, multimodal models.\n\nSeeking: Deep Learning internships\nSkills: Attention, Transformers, PyTorch", category: "Deep Learning", imageKeyword: "attention mechanisms" },

                // MLOps
                { linkedin: "Just shipped a complete ML pipeline: data ingestion → preprocessing → 16 experiments → selection → deployment.\n\nFull stack: FastAPI + Streamlit + Docker + MLflow + Render.\n\nBuilding the model = 30%. Deploying reliably = 70%.\n\nIf you're only writing notebooks, you're not building products.\n\n#MLOps #Docker #FastAPI", handshake: "End-to-End ML Deployment 🚀\n\nPipeline: Data → Model → Production\n\nTech Stack:\n• FastAPI (backend REST endpoints)\n• Streamlit (frontend UI)\n• Docker (containerization)\n• MLflow (experiment tracking)\n• Render (cloud hosting)\n\nLessons: Model = 30%, deployment = 70%.\n\nSeeking: MLOps internships", category: "MLOps", imageKeyword: "machine learning deployment" },
                { linkedin: "\"Works on my machine\" → Docker → \"Works everywhere.\"\n\nShipped FastAPI + Streamlit with docker-compose. Same dependencies, same environment, dev → prod. Zero surprises.\n\nIf you're not containerizing ML projects, you're limiting impact.\n\nDocker is non-negotiable.\n\n#Docker #MLOps #DevOps", handshake: "Docker: Production-Ready ML 🐳\n\nContainerizing ML applications:\n\nBefore Docker:\n❌ Dependencies conflicts\n❌ Environment mismatches\n\nAfter Docker:\n✅ Consistent environments\n✅ Reproducibility\n✅ Easy deployment\n\nEssential skill for ML engineers.\n\nSeeking: MLOps internships\nSkills: Docker, docker-compose", category: "MLOps", imageKeyword: "docker" },
                { linkedin: "Tracked 16 classification models in MLflow: hyperparameters, metrics, artifacts, everything.\n\nCompared side-by-side. Selected best by F1-score. Without MLflow, I'd be scrolling notebooks wondering which model was which.\n\nReproducibility is non-negotiable.\n\n#MLOps #MLflow #MachineLearning", handshake: "MLflow: Experiment Tracking 📊\n\nManaging 16 ML experiments:\n• Log parameters (hyperparameters)\n• Track metrics (accuracy, F1)\n• Store artifacts (models, plots)\n• Compare experiments\n• Deploy models\n\nResult: Reproducible, auditable ML.\n\nSeeking: MLOps internships\nSkills: MLflow, experiment tracking", category: "MLOps", imageKeyword: "experiment tracking" },
                { linkedin: "CI/CD for ML: automated testing + deployment.\n\nEvery commit triggers tests → builds Docker image → deploys to staging → production.\n\nReliable, repeatable releases.\n\n#MLOps #CI/CD #DevOps", handshake: "CI/CD for ML Systems 🔄\n\nAutomated pipeline:\n• Code commit\n• Run tests (unit, integration)\n• Build Docker image\n• Deploy to staging\n• Production deployment\n\nBenefit: Reliable, repeatable releases.\n\nSeeking: MLOps internships\nSkills: GitHub Actions, CI/CD, Docker", category: "MLOps", imageKeyword: "CI/CD pipeline" },
                { linkedin: "Model versioning matters. Tracked model changes, retraining dates, performance metrics.\n\nWhen did performance degrade? Which model version caused it?\n\nModel registry = production safety net.\n\n#MLOps #ModelManagement #MachineLearning", handshake: "Model Versioning & Registry 📋\n\nManaging model lifecycle:\n• Version control (git for code + models)\n• Model registry (MLflow, DVC)\n• Performance tracking\n• Rollback capability\n\nCritical for production reliability.\n\nSeeking: MLOps internships\nSkills: MLflow, model versioning", category: "MLOps", imageKeyword: "model management" },
                { linkedin: "Model monitoring prevents silent failures. Tracked prediction latency, input data drift, output distribution shift.\n\nData changes. Your model performance degrades. You need alerts.\n\n#MLOps #Monitoring #ProductionML", handshake: "Model Monitoring in Production 📊\n\nTracked key metrics:\n• Prediction latency (response time)\n• Data drift (input distribution change)\n• Output shift (prediction distribution)\n• Error rates\n\nAlerts trigger when metrics degrade.\n\nSeeking: MLOps internships\nSkills: Monitoring, alerting, production systems", category: "MLOps", imageKeyword: "monitoring" },
                { linkedin: "API design matters for ML services. Built RESTful endpoints with proper status codes, error handling, rate limiting.\n\nYour model is only useful if users can access it reliably.\n\n#MLOps #API #SoftwareEngineering", handshake: "Building Scalable ML APIs 🔌\n\nDesigned REST API for ML model:\n• Proper HTTP status codes\n• Request validation\n• Rate limiting\n• Error handling\n• Documentation\n\nResult: Reliable, scalable service.\n\nSeeking: MLOps / ML Engineering internships\nSkills: FastAPI, API design", category: "MLOps", imageKeyword: "API design" },

                // Career & Learning
                { linkedin: "Currently taking Statistical Learning, Data Modeling, Query Language this semester.\n\nDeep dive: clustering analysis, k-means, hierarchical clustering, silhouette analysis.\n\nRaw clustering = 20%. Feature engineering + interpretation = 80%.\n\nThis is what production ML looks like.\n\n#DataScience #StatisticalLearning #MachineLearning", handshake: "Statistical Learning This Semester 📚\n\nEnrolled in courses:\n• Statistical Learning (regression, classification)\n• Data Modeling (schema design)\n• Query Language (SQL)\n• Clustering analysis\n\nKey: Theory + practice. Academic rigor + production constraints.\n\nSeeking internships combining both.", category: "Career", imageKeyword: "learning" },
                { linkedin: "3+ years building ML systems across banking, healthcare, fintech. Here's what actually matters:\n\n1. Feature engineering > model choice\n2. Class imbalance is everywhere (use SMOTE)\n3. SHAP > black boxes\n4. Docker/MLflow/FastAPI = career skills\n5. Communication > fancy algorithms\n\nOpen to internships building real systems.\n\n#DataScience #MLEngineering", handshake: "3 Years of ML Lessons 💡\n\nLessons that matter:\n1️⃣ Features > models (always)\n2️⃣ Class imbalance everywhere\n3️⃣ Interpretability mandatory\n4️⃣ MLOps = career skills\n5️⃣ Business impact > complexity\n\nSeeking: Data Science / ML internships Summer 2025\nReady to build systems at scale.", category: "Career", imageKeyword: "career development" },
                { linkedin: "2025 trends I'm watching:\n\n1. LLMOps (prompt engineering frameworks)\n2. Multi-modal AI (text + images + audio)\n3. Edge ML (on-device models)\n4. Explainability (SHAP mandatory)\n\nStaying current = competitive advantage.\n\nLooking for internships where I can grow with these.\n\n#AI #MachineLearning #FutureOfML", handshake: "2025 ML Trends 🚀\n\nWhat's trending:\n1. LLMOps: Production LLM systems\n2. Multi-modal: Text + vision unified\n3. Edge ML: On-device inference\n4. Explainability: SHAP/LIME standard\n\nPersonal focus: Building with these trends.\n\nSeeking: AI / ML internships\nReady for cutting-edge work.", category: "Career", imageKeyword: "technology trends" },
                { linkedin: "Building consistently compounds. Posted every day for 2 months. Visibility = recruiter attention.\n\nRecruiter DMs started flowing. Internship offers followed.\n\nConsistency > perfection. Show up daily.\n\n#DataScience #Networking #Career", handshake: "Consistency Gets Results 🚀\n\nPosting daily for 2 months:\n✓ Recruiter visibility\n✓ Profile ranking boost\n✓ DM inquiries\n✓ Interview opportunities\n\nProof: Consistency > perfection.\n\nSeeking: Data Science / ML internships\nReady to talk about my work daily.", category: "Career", imageKeyword: "networking" },
                { linkedin: "Just accepted an internship at a top fintech company. Here's why recruiters reached out:\n\n1. Consistent LinkedIn posting (daily)\n2. GitHub portfolio with real projects\n3. Live demos (streamlit.app)\n4. Clear technical communication\n5. Specific about what I wanted\n\nMake yourself findable.\n\n#DataScience #Career #Internship", handshake: "How I Got the Internship 💼\n\nWhat worked:\n✓ Daily LinkedIn posts\n✓ Real GitHub projects\n✓ Live project demos\n✓ Clear technical communication\n✓ Specific internship targets\n\nRecruiter finding = easy when you're visible.\n\nNow building AI/ML systems in production.\n\nYou can do this too.", category: "Career", imageKeyword: "internship" },
            ];

            const [posts, setPosts] = useState(allPosts);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [activePlatform, setActivePlatform] = useState('linkedin');
            const [copied, setCopied] = useState(false);
            const [imageUrl, setImageUrl] = useState('');
            const [loadingImage, setLoadingImage] = useState(false);

            useEffect(() => {
                generateImage();
            }, [currentIndex]);

            const generateImage = async () => {
                setLoadingImage(true);
                try {
                    const post = posts[currentIndex];
                    const keyword = post.imageKeyword;
                    // Using Unsplash API (free, no key needed for basic usage)
                    const response = await fetch(`https://api.unsplash.com/search/photos?query=${keyword}&client_id=SFV0GD7e__zfAJ-l0pJKKJQdxIPLrY-qMSz3tVLr_hA&count=1`);
                    const data = await response.json();
                    
                    if (data.results && data.results.length > 0) {
                        setImageUrl(data.results[0].urls.regular);
                    } else {
                        // Fallback to a generic image
                        setImageUrl(`https://via.placeholder.com/600x400?text=${keyword}`);
                    }
                } catch (error) {
                    console.error('Image load error:', error);
                    setImageUrl(`https://via.placeholder.com/600x400?text=Data+Science`);
                } finally {
                    setLoadingImage(false);
                }
            };

            const currentPost = posts[currentIndex];
            const currentContent = activePlatform === 'linkedin' ? currentPost.linkedin : currentPost.handshake;

            const copyPost = () => {
                const imageMarkdown = `![${currentPost.category}](${imageUrl})\n\n`;
                const fullContent = imageMarkdown + currentContent;
                navigator.clipboard.writeText(fullContent);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const deletePost = () => {
                const newPosts = posts.filter((_, idx) => idx !== currentIndex);
                setPosts(newPosts);
                if (currentIndex >= newPosts.length && currentIndex > 0) {
                    setCurrentIndex(currentIndex - 1);
                }
                alert(`Post deleted! ${newPosts.length} posts remaining.`);
            };

            const nextPost = () => {
                if (currentIndex < posts.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                }
            };

            const prevPost = () => {
                if (currentIndex > 0) {
                    setCurrentIndex(currentIndex - 1);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 p-6">
                    <div className="max-w-3xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-bold text-white mb-2">
                                60-Day Post Generator
                            </h1>
                            <p className="text-blue-300 text-lg">With AI-Generated Images</p>
                            <p className="text-slate-400 text-sm mt-2">{posts.length} Posts + Images | LinkedIn + Handshake</p>
                        </div>

                        {/* Platform Buttons */}
                        <div className="flex gap-3 mb-6 justify-center">
                            <button
                                onClick={() => setActivePlatform('linkedin')}
                                className={`px-8 py-3 rounded-lg font-semibold transition-all text-lg ${
                                    activePlatform === 'linkedin'
                                        ? 'bg-blue-600 text-white shadow-lg'
                                        : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                }`}
                            >
                                💼 LinkedIn
                            </button>
                            <button
                                onClick={() => setActivePlatform('handshake')}
                                className={`px-8 py-3 rounded-lg font-semibold transition-all text-lg ${
                                    activePlatform === 'handshake'
                                        ? 'bg-green-600 text-white shadow-lg'
                                        : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                }`}
                            >
                                🤝 Handshake
                            </button>
                        </div>

                        {/* Post Card */}
                        <div className="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 mb-8 shadow-2xl">
                            {/* Header */}
                            <div className="flex justify-between items-start mb-6 pb-4 border-b border-slate-700">
                                <div>
                                    <p className="text-blue-300 font-semibold text-sm">{currentPost.category}</p>
                                    <p className="text-slate-400 text-xs mt-1">Post {currentIndex + 1} of {posts.length}</p>
                                </div>
                                <button
                                    onClick={deletePost}
                                    className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-semibold transition-all text-sm"
                                >
                                    🗑️ Remove
                                </button>
                            </div>

                            {/* Image */}
                            <div className="mb-6 rounded-lg overflow-hidden border border-slate-700 bg-slate-900">
                                {loadingImage ? (
                                    <div className="h-64 flex items-center justify-center bg-slate-900">
                                        <p className="text-slate-400">Loading image...</p>
                                    </div>
                                ) : (
                                    <img 
                                        src={imageUrl} 
                                        alt={currentPost.category}
                                        className="w-full h-64 object-cover"
                                        onError={() => setImageUrl(`https://via.placeholder.com/600x400?text=${currentPost.category}`)}
                                    />
                                )}
                            </div>

                            {/* Content */}
                            <div className="bg-slate-900/50 p-6 rounded-lg mb-6 border border-slate-700 min-h-48">
                                <p className="text-slate-100 whitespace-pre-wrap leading-relaxed">
                                    {currentContent}
                                </p>
                            </div>

                            {/* Copy Button */}
                            <button
                                onClick={copyPost}
                                className={`w-full px-6 py-3 rounded-lg font-semibold transition-all text-lg flex items-center justify-center gap-2 ${
                                    copied
                                        ? 'bg-green-600 text-white'
                                        : activePlatform === 'linkedin'
                                        ? 'bg-blue-600 hover:bg-blue-700 text-white'
                                        : 'bg-green-600 hover:bg-green-700 text-white'
                                }`}
                            >
                                {copied ? '✓ Copied (with Image)!' : '📋 Copy Post + Image'}
                            </button>
                        </div>

                        {/* Navigation */}
                        <div className="flex gap-3 justify-between">
                            <button
                                onClick={prevPost}
                                disabled={currentIndex === 0}
                                className="px-6 py-3 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-white rounded-lg font-semibold transition-all disabled:cursor-not-allowed"
                            >
                                ← Previous
                            </button>

                            <div className="text-center text-slate-300">
                                <p className="font-semibold text-sm">Day {currentIndex + 1}</p>
                                <p className="text-xs mt-1">{posts.length} posts total</p>
                            </div>

                            <button
                                onClick={nextPost}
                                disabled={currentIndex === posts.length - 1}
                                className="px-6 py-3 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-white rounded-lg font-semibold transition-all disabled:cursor-not-allowed"
                            >
                                Next →
                            </button>
                        </div>

                        {/* Info */}
                        <div className="mt-8 p-6 bg-slate-800/30 border border-slate-700 rounded-lg text-slate-300 text-sm">
                            <p className="font-semibold text-cyan-400 mb-3">How to use:</p>
                            <ul className="space-y-2 ml-4 text-sm">
                                <li>✓ Each post comes with a relevant AI-generated image</li>
                                <li>✓ Choose platform (LinkedIn or Handshake)</li>
                                <li>✓ Read the post</li>
                                <li>✓ Click "Copy Post + Image" - copies both</li>
                                <li>✓ Paste on LinkedIn/Handshake and publish</li>
                                <li>✓ Don't like it? Click "Remove"</li>
                                <li>✓ Navigate with Previous/Next buttons</li>
                                <li>✓ Post daily for 60 days = 2 months of content</li>
                            </ul>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<PostGenerator />, document.getElementById('root'));
    </script>
</body>
</html>
