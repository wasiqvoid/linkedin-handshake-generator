                            </div>
                            <p className="text-slate-400 text-lg">AI • ML • LLMs • Data Science Internship 2025</p>
                            <p className="text-slate-500 text-sm mt-2">Dynamic posts. Remove what you don't like. Generate new ones.</p>
                        </div>

                        {/* Platform & Control Buttons */}
                        <div className="flex flex-col gap-4 mb-8">
                            <div className="flex gap-4 justify-center">
                                <button
                                    onClick={() => setActivePlatform('linkedin')}
                                    className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-all ${
                                        activePlatform === 'linkedin'
                                            ? 'bg-gradient-to-r from-blue-600 to-cyan-500 text-white shadow-lg'
                                            : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                    }`}
                                >
                                    <span>💼</span>
                                    LinkedIn
                                </button>
                                <button
                                    onClick={() => setActivePlatform('handshake')}
                                    className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-all ${
                                        activePlatform === 'handshake'
                                            ? 'bg-gradient-to-r from-green-600 to-emerald-500 text-white shadow-lg'
                                            : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                    }`}
                                >
                                    <span>🤝</span>
                                    Handshake
                                </button>


                        {/* Post Card */}
                        <div className="bg-slate-800/50 backdrop-blur border border-slate-700 rounded-2xl p-8 mb-8 shadow-2xl fade-in">
                            {/* Meta */}
                            <div className="flex items-center justify-between mb-6 pb-6 border-b border-slate-700">
                                <div>
                                    <div className="text-sm text-cyan-400 font-semibold tracking-wide mb-1">{post.day}</div>
                                    <h2 className="text-2xl font-bold text-white">{post.theme}</h2>
                                    <p className="text-slate-400 text-sm mt-1">Category: {post.category}</p>
                                </div>
                                <div className="text-right">
                                    <div className="text-4xl font-bold text-slate-600">{String((currentDay % posts.length) + 1).padStart(2, '0')}</div>
                                    <div className="text-xs text-slate-500">of {posts.length}</div>
                                </div>
                            </div>

                            {/* Post Title */}
                            <div className="mb-6">
                                <h3 className="text-xl font-semibold text-white mb-4">{post.title}</h3>
                                <p className={`text-xs font-semibold mb-4 ${activePlatform === 'linkedin' ? 'text-blue-400' : 'text-green-400'}`}>
                                    {activePlatform === 'linkedin' ? '📱 LINKEDIN VERSION' : '🤝 HANDSHAKE VERSION'}
                                </p>
                            </div>

                            {/* Post Content */}
                            <div className="mb-6">
                                <div className="text-slate-200 leading-relaxed whitespace-pre-wrap text-base bg-slate-900/50 p-6 rounded-lg border border-slate-700 max-h-96 overflow-y-auto">
                                    {currentText}
                                </div>
                            </div>

                            {/* Action Buttons */}
                            <div className="flex gap-3">
                                <button
                                    onClick={copyToClipboard}
                                    className={`flex-1 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 flex items-center justify-center gap-2 shadow-lg hover:shadow-xl ${
                                        activePlatform === 'linkedin'
                                            ? 'bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600'
                                            : 'bg-gradient-to-r from-green-600 to-emerald-500 hover:from-green-700 hover:to-emerald-600'
                                    }`}
                                >
                                    <span>📋</span>
                                    {copied ? 'Copied!' : 'Copy Post'}
                                </button>
                                <a
                                    href={activePlatform === 'linkedin' ? 'https://www.linkedin.com' : 'https://app.joinhandshake.com'}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 flex items-center justify-center gap-2"
                                >
                                    Post →
                                </a>
                            </div>
                        </div>

                        {/* Navigation */}
                        <div className="flex items-center justify-between mb-8">
                            <button
                                onClick={prevPost}
                                disabled={currentDay === 0}
                                className="px-6 py-2 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-lg transition-all"
                            >
                                ← Previous
                            </button>
                            
                            <div className="text-center">
                                <div className="text-slate-400 text-sm">Dynamic Posts</div>
                                <div className="text-slate-300 font-semibold">{posts.length} posts available</div>
                            </div>

                            <button
                                onClick={nextPost}
                                className={`px-6 py-2 text-white rounded-lg transition-all ${
                                    activePlatform === 'linkedin'
                                        ? 'bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600'
                                        : 'bg-gradient-to-r from-green-600 to-emerald-500 hover:from-green-700 hover:to-emerald-600'
                                }`}
                            >
                                Next →
                            </button>
                        </div>

                        {/* Info Box */}
                        <div className="bg-slate-800/30 border border-slate-700 rounded-lg p-6 text-slate-300 text-sm space-y-3">
                            <p className="font-semibold text-cyan-400">💡 How to use:</p>
                            <ul className="space-y-2 ml-4">
                                <li>✓ Choose platform (LinkedIn or Handshake)</li>
                                <li>✓ Read the post (optimized for that platform)</li>
                                <li>✓ <strong>Remove posts you don't like</strong> (🗑️ button)</li>
                                <li>✓ <strong>Generate new posts</strong> (🔄 button) from different topics</li>
                                <li>✓ Click "Copy Post" to copy to clipboard</li>
                                <li>✓ Paste on the platform and review/edit if needed</li>
                                <li>✓ Post! (You control what goes live)</li>
                            </ul>
                            <p className="text-xs text-slate-500 mt-4">🎯 <strong>Topics covered:</strong> Data Engineering, Machine Learning, NLP & AI, Analytics, Deep Learning, MLOps, Career insights.</p>
                            <p className="text-xs text-slate-500">💼 Each post is optimized per platform - LinkedIn is longer/narrative, Handshake is structured/action-oriented.</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<PostGenerator />, document.getElementById('root'));
    </script>
</body>
</html>
