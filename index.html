<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Generator | Wasiq Bakhsh</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function PostGenerator() {
            // START EMPTY (you can add new posts dynamically)
            const [posts, setPosts] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [activePlatform, setActivePlatform] = useState('linkedin');
            const [copied, setCopied] = useState(false);

            const [newLinkedIn, setNewLinkedIn] = useState('');
            const [newHandshake, setNewHandshake] = useState('');
            const [newCategory, setNewCategory] = useState('General');

            const currentPost = posts[currentIndex];
            const currentContent = currentPost
                ? activePlatform === 'linkedin'
                    ? currentPost.linkedin
                    : currentPost.handshake
                : '';

            const addPost = () => {
                if (!newLinkedIn.trim() && !newHandshake.trim()) return;

                const newPost = {
                    linkedin: newLinkedIn,
                    handshake: newHandshake,
                    category: newCategory
                };

                setPosts([...posts, newPost]);
                setNewLinkedIn('');
                setNewHandshake('');
                setNewCategory('General');
            };

            const copyPost = () => {
                if (!currentContent) return;
                navigator.clipboard.writeText(currentContent);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const deletePost = () => {
                const newPosts = posts.filter((_, idx) => idx !== currentIndex);
                setPosts(newPosts);
                if (currentIndex >= newPosts.length && currentIndex > 0) {
                    setCurrentIndex(currentIndex - 1);
                }
            };

            const nextPost = () => {
                if (currentIndex < posts.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                }
            };

            const prevPost = () => {
                if (currentIndex > 0) {
                    setCurrentIndex(currentIndex - 1);
                }
            };

            return (
                <div className="min-h-screen bg-slate-900 p-6 text-white">
                    <div className="max-w-3xl mx-auto">
                        <h1 className="text-3xl font-bold mb-6 text-center">
                            Custom Post Generator 🚀
                        </h1>

                        {/* Add New Post */}
                        <div className="bg-slate-800 p-4 rounded-lg mb-6">
                            <textarea
                                placeholder="LinkedIn Post..."
                                value={newLinkedIn}
                                onChange={(e) => setNewLinkedIn(e.target.value)}
                                className="w-full p-2 mb-2 bg-slate-700 rounded"
                            />
                            <textarea
                                placeholder="Handshake Post..."
                                value={newHandshake}
                                onChange={(e) => setNewHandshake(e.target.value)}
                                className="w-full p-2 mb-2 bg-slate-700 rounded"
                            />
                            <input
                                placeholder="Category"
                                value={newCategory}
                                onChange={(e) => setNewCategory(e.target.value)}
                                className="w-full p-2 mb-2 bg-slate-700 rounded"
                            />
                            <button
                                onClick={addPost}
                                className="bg-blue-600 px-4 py-2 rounded"
                            >
                                ➕ Add Post
                            </button>
                        </div>

                        {/* Display Post */}
                        {posts.length > 0 ? (
                            <div className="bg-slate-800 p-6 rounded-lg">
                                <p className="text-sm text-blue-300 mb-2">
                                    {currentPost.category}
                                </p>

                                <div className="bg-slate-700 p-4 rounded mb-4">
                                    <p className="whitespace-pre-wrap">
                                        {currentContent}
                                    </p>
                                </div>

                                <button
                                    onClick={copyPost}
                                    className="bg-green-600 px-4 py-2 rounded mr-2"
                                >
                                    {copied ? 'Copied!' : 'Copy'}
                                </button>

                                <button
                                    onClick={deletePost}
                                    className="bg-red-600 px-4 py-2 rounded"
                                >
                                    Delete
                                </button>

                                <div className="flex justify-between mt-4">
                                    <button onClick={prevPost}>⬅ Prev</button>
                                    <button onClick={nextPost}>Next ➡</button>
                                </div>
                            </div>
                        ) : (
                            <p className="text-center text-slate-400">
                                No posts yet. Add your first post above 👆
                            </p>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<PostGenerator />, document.getElementById('root'));
    </script>
</body>
</html>
