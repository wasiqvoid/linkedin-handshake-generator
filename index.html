<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Daily Post Generator (LLM Powered) 🚀</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function PostGenerator() {
    const [interest, setInterest] = useState('Data Engineering, ML, NLP');
    const [post, setPost] = useState('');
    const [loading, setLoading] = useState(false);
    const [apiKey, setApiKey] = useState('');

    // FREE LLM: OpenRouter (supports many free models)
    const generatePost = async () => {
        if (!apiKey) {
            alert("Enter your OpenRouter API key");
            return;
        }

        setLoading(true);

        const prompt = `Write a LinkedIn post for a Master's student in Data Science interested in ${interest}.

Make it:
- Engaging
- Personal
- Professional
- Include hook + insights + hashtags
- Keep it under 150 words`;

        try {
            const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "mistralai/mistral-7b-instruct:free",
                    messages: [
                        { role: "user", content: prompt }
                    ]
                })
            });

            const data = await res.json();
            const text = data.choices?.[0]?.message?.content || "Error generating post";
            setPost(text);
        } catch (err) {
            setPost("Error connecting to LLM");
        }

        setLoading(false);
    };

    const copyPost = () => {
        navigator.clipboard.writeText(post);
        alert("Copied!");
    };

    return (
        <div className="min-h-screen bg-black text-white p-6">
            <div className="max-w-2xl mx-auto">

                <h1 className="text-4xl font-bold text-center mb-4">🤖 AI Post Generator (FREE LLM)</h1>

                {/* API KEY */}
                <div className="mb-4">
                    <input
                        type="password"
                        placeholder="Enter OpenRouter API Key"
                        value={apiKey}
                        onChange={(e)=>setApiKey(e.target.value)}
                        className="w-full p-3 bg-slate-800 rounded"
                    />
                </div>

                {/* Interests */}
                <div className="mb-4">
                    <input
                        value={interest}
                        onChange={(e)=>setInterest(e.target.value)}
                        className="w-full p-3 bg-slate-800 rounded"
                    />
                </div>

                <button
                    onClick={generatePost}
                    className="w-full bg-purple-600 py-3 rounded mb-6"
                >
                    {loading ? 'Generating...' : '⚡ Generate AI Post'}
                </button>

                {post && (
                    <div className="bg-slate-800 p-6 rounded">
                        <div className="whitespace-pre-wrap mb-4">{post}</div>

                        <button
                            onClick={copyPost}
                            className="bg-green-600 px-4 py-2 rounded"
                        >
                            📋 Copy
                        </button>
                    </div>
                )}

            </div>
        </div>
    );
}

ReactDOM.render(<PostGenerator />, document.getElementById('root'));
</script>
</body>
</html>
