<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Daily Post Generator 🚀</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function PostGenerator() {
    const [interest, setInterest] = useState('Data Engineering, ML, NLP');
    const [post, setPost] = useState('');
    const [copied, setCopied] = useState(false);
    const [streak, setStreak] = useState(0);

    useEffect(() => {
        const savedStreak = localStorage.getItem('streak');
        if (savedStreak) setStreak(parseInt(savedStreak));
    }, []);

    useEffect(() => {
        localStorage.setItem('streak', streak);
    }, [streak]);

    const generatePost = () => {
        const topics = interest.split(',');
        const randomTopic = topics[Math.floor(Math.random() * topics.length)].trim();

        const templates = [
            `🚀 Today I explored ${randomTopic}.

One thing I realized:
Consistency beats intensity.

Small improvements daily compound into massive growth.

#Learning #${randomTopic.replace(/ /g, '')}`,

            `💡 Quick insight on ${randomTopic}:

Most people overcomplicate it.

The real skill is understanding fundamentals and applying them consistently.

#${randomTopic.replace(/ /g, '')} #GrowthMindset`,

            `📊 What I learned today in ${randomTopic}:

→ Focus on fundamentals
→ Build projects
→ Stay consistent

Simple, but powerful.

#DataScience #${randomTopic.replace(/ /g, '')}`
        ];

        const newPost = templates[Math.floor(Math.random() * templates.length)];
        setPost(newPost);
    };

    const copyPost = () => {
        navigator.clipboard.writeText(post);
        setCopied(true);
        setStreak(streak + 1);
        setTimeout(() => setCopied(false), 2000);
    };

    return (
        <div className="min-h-screen bg-black text-white p-6">
            <div className="max-w-2xl mx-auto">

                <h1 className="text-4xl font-bold text-center mb-4">🤖 AI Daily Post Generator</h1>
                <p className="text-center text-slate-400 mb-6">Your Personal LinkedIn Growth Engine</p>

                <div className="text-center text-yellow-400 mb-6">🔥 Streak: {streak} days</div>

                {/* Interests */}
                <div className="mb-6">
                    <label className="block mb-2">Your Interests (comma separated)</label>
                    <input
                        value={interest}
                        onChange={(e) => setInterest(e.target.value)}
                        className="w-full p-3 bg-slate-800 rounded"
                    />
                </div>

                {/* Generate */}
                <button
                    onClick={generatePost}
                    className="w-full bg-purple-600 py-3 rounded mb-6"
                >
                    ⚡ Generate Today's Post
                </button>

                {/* Output */}
                {post && (
                    <div className="bg-slate-800 p-6 rounded">
                        <div className="whitespace-pre-wrap mb-4">{post}</div>

                        <button
                            onClick={copyPost}
                            className="bg-green-600 px-4 py-2 rounded"
                        >
                            {copied ? 'Copied!' : '📋 Copy & Post'}
                        </button>
                    </div>
                )}

            </div>
        </div>
    );
}

ReactDOM.render(<PostGenerator />, document.getElementById('root'));
</script>
</body>
</html>
