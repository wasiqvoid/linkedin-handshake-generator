            const [currentIndex, setCurrentIndex] = useState(0);
            const [activePlatform, setActivePlatform] = useState('linkedin');

            const currentPost = posts[currentIndex];
            const currentContent = activePlatform === 'linkedin' ? currentPost.linkedin : currentPost.handshake;

            const copyPost = () => {
                navigator.clipboard.writeText(currentContent);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const deletePost = () => {
                const newPosts = posts.filter((_, idx) => idx !== currentIndex);
                setPosts(newPosts);
                if (currentIndex >= newPosts.length && currentIndex > 0) {
                    setCurrentIndex(currentIndex - 1);
                }
                alert(`Post deleted! ${newPosts.length} posts remaining.`);
            };

            const nextPost = () => {
                if (currentIndex < posts.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                }
            };

            const prevPost = () => {
                if (currentIndex > 0) {
                    setCurrentIndex(currentIndex - 1);
                }

                                onClick={prevPost}
                                disabled={currentIndex === 0}
                                className="px-6 py-3 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-white rounded-lg font-semibold transition-all disabled:cursor-not-allowed"
                            >
                                ← Previous
                            </button>

                            <div className="text-center text-slate-300">
                                <p className="font-semibold text-sm">Day {currentIndex + 1}</p>
                                <p className="text-xs mt-1">{posts.length} posts total</p>
                            </div>

                            <button
                                onClick={nextPost}
                                disabled={currentIndex === posts.length - 1}
                                className="px-6 py-3 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-white rounded-lg font-semibold transition-all disabled:cursor-not-allowed"
                            >
                                Next →
                            </button>
                        </div>

                        {/* Info */}
                        <div className="mt-8 p-6 bg-slate-800/30 border border-slate-700 rounded-lg text-slate-300 text-sm">
                            <p className="font-semibold text-cyan-400 mb-3">✨ 80+ NEW POSTS:</p>
                            <ul className="space-y-2 ml-4 text-sm">
                                <li>✓ 80+ unique posts across all topics</li>
                                <li>✓ Data Engineering, ML, NLP, Analytics, Deep Learning, MLOps, Career</li>
                                <li>✓ Both LinkedIn (narrative) and Handshake (action-oriented) versions</li>
                                <li>✓ 100% FREE - no API keys, no setup, no cost</li>
                                <li>✓ One-click copy to clipboard</li>
                                <li>✓ Remove posts you don't like</li>
                                <li>✓ Navigate with Previous/Next buttons</li>
                                <li>✓ Post daily for 80+ days = 2.5+ months of content</li>
                            </ul>
                            <p className="text-xs text-slate-500 mt-4 font-semibold">
                                🚀 Ready to deploy? Push to GitHub and start posting immediately!
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<PostGenerator />, document.getElementById('root'));
    </script>
</body>
</html>
